# git-cliff ~ configuration file
# https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

"""
body = """
{% if version -%}
  ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}

{% else -%}
  ## [Unreleased]

{% endif -%}
{% for group, commits in commits | group_by(attribute="group") -%}
  ### {{ group | upper_first }}
  {% for commit in commits -%}
  - {% if commit.breaking %}**breaking:** {% endif %}{{ commit.message | split(pat="\n") | first | upper_first | trim }}
  {% endfor %}
{% endfor %}
"""
trim = true
footer = ""

[git]
# Parse commits according to the conventional commits specification.
conventional_commits = true
# Keep non-conventional commits (group them under Miscellaneous) instead of
# silently dropping them.
filter_unconventional = false
# An array of regex based parsers for grouping commits.
# Ordered from most specific to the catch-all. Groups follow game-engine
# changelog conventions (Added, Changed, Fixed, Removed, Performance, Internal).
commit_parsers = [
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Changed" },
  { message = "^.*: revert", group = "Removed" },
  { message = "^docs", group = "Documentation" },
  { message = "^(test|style|chore|ci|build)", group = "Internal" },
  { message = ".*", group = "Miscellaneous" },
]
filter_commits = false
topo_order = false
sort_commits = "newest"