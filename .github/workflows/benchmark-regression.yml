name: Benchmark Regression Detection

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  benchmark:
    name: Performance Regression Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxcursor-dev libxrandr-dev \
            libxinerama-dev libxi-dev libgl1-mesa-dev

      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@latest

      - name: Run benchmarks
        run: |
          cd benchmark
          go test -bench=. -benchmem -benchtime=1s -count=8 -run='^$' \
            -skip='^BenchmarkMemoryPerEntity' ./... | tee current.txt

      # Restore the most recent Linux baseline saved by a main-branch run.
      # The primary key never matches (it only enables prefix restore);
      # restore-keys finds the latest linux-benchmark-baseline-*.
      - name: Restore Linux baseline
        uses: actions/cache/restore@v4
        with:
          path: benchmark/baselines/linux-latest.txt
          key: linux-benchmark-baseline-never-matches
          restore-keys: |
            linux-benchmark-baseline-

      - name: Compare against baseline (benchstat)
        run: |
          set -eo pipefail
          if [ ! -f benchmark/baselines/linux-latest.txt ]; then
            echo "::warning::No Linux baseline found; skipping regression comparison."
            echo "The first successful run on main will create the baseline."
            {
              echo '### Benchmark comparison'
              echo '```text'
              echo 'No baseline yet — comparison skipped (first main run bootstraps it).'
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          benchstat benchmark/baselines/linux-latest.txt benchmark/current.txt > benchmark/benchstat.txt
          cat benchmark/benchstat.txt
          {
            echo '### Benchmark comparison (benchstat: base vs current)'
            echo '```text'
            cat benchmark/benchstat.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          python3 ./.github/scripts/benchstat_gate.py benchmark/benchstat.txt

      # On main, refresh the baseline so PRs compare against the latest main.
      # The cache save uses a unique key (run_id) so it always writes a fresh
      # entry; restore-keys above resolves to the most recent one.
      - name: Update Linux baseline (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cp benchmark/current.txt benchmark/baselines/linux-latest.txt

      - name: Save Linux baseline (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: benchmark/baselines/linux-latest.txt
          key: linux-benchmark-baseline-${{ github.run_id }}
