name: Benchmark Regression Detection

on:
  pull_request:
    paths:
      - "internal/**"
      - "components/**"
      - "benchmark/**"
      - "geom/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/benchmark-regression.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  benchmark:
    name: Performance Regression Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxcursor-dev libxrandr-dev \
            libxinerama-dev libxi-dev libgl1-mesa-dev

      - name: Run benchmarks
        run: |
          cd benchmark
          go test -bench=. -benchmem -benchtime=200ms -count=8 -run='^$' ./... | tee output.txt

      - name: Create cache directory
        run: mkdir -p ./cache

      - name: Download benchmark history
        uses: actions/cache@v4
        with:
          path: ./cache
          # Use PR number to isolate benchmarks per PR, preventing cross-PR cache pollution
          key: ${{ runner.os }}-benchmark-pr-${{ github.event.pull_request.number }}
          restore-keys: |
            ${{ runner.os }}-benchmark-

      - name: Compare and store benchmark results
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Castrum Go Benchmarks
          tool: go
          output-file-path: benchmark/output.txt
          external-data-json-path: ./cache/benchmark-data.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          alert-threshold: 110%
          fail-threshold: 120%
          fail-on-alert: true
          comment-on-alert: true
          comment-always: false
          summary-always: true
          alert-comment-cc-users: "@Leonard-Atorough"
