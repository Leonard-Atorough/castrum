name: Release

on:
  push:
    branches: [main, beta]

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node (for semantic-release)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install semantic-release
        run: npm install -g semantic-release @semantic-release/changelog @semantic-release/git @semantic-release/github @semantic-release/commit-analyzer @semantic-release/release-notes-generator

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: semantic-release

      - name: Update VERSION file (fallback)
        if: failure()
        run: |
          VERSION=$(cat VERSION | sed 's/-alpha//')
          echo "VERSION file: $VERSION"

  notify:
    name: Build Notification
    runs-on: ubuntu-latest
    needs: release
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: echo "version=$(cat VERSION)" >> $GITHUB_OUTPUT

      - name: Notify on success
        if: needs.release.result == 'success'
        run: |
          echo "Release published. Version: ${{ steps.version.outputs.version }}"

      - name: Notify on failure
        if: needs.release.result == 'failure'
        run: echo "Release job failed. Manual review needed."
