name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  conventional-commits:
    name: Validate Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate PR title (merge commit format)
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            docs
            style
            refactor
            test
            chore
            ci
            build
          requireScope: false

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.27"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libxxf86vm-dev libgl1-mesa-dev

      - name: Run go fmt
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go code not formatted:"
            gofmt -d .
            exit 1
          fi

      - name: Run go vet
        run: |
          go vet $(go list ./... | grep -v '/internal/render')

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.27"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libxxf86vm-dev libgl1-mesa-dev

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: |
          xvfb-run -a go test -v -race -coverprofile=coverage.out $(go list ./... | grep -vE '/internal/render|/(cmd|examples)(/|$)')

      - name: Use checkout for examples and starter
        run: |
          go work init .
          go work use ./templates/starter
          go work use -r ./examples

      - name: Test shared example assets
        run: go test ./examples/audio

      - name: Build, vet and test examples and starter
        run: bash ./.github/scripts/check-examples.sh

      - name: Check coverage threshold
        run: |
          coverage=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Coverage: $coverage%"
          if (( $(echo "$coverage < 85" | bc -l) )); then
            echo "Coverage below 85% threshold"
            exit 1
          fi
          {
            echo "### Per-package coverage (statements)"
            echo '```'
            awk 'FNR > 1 {
              split($1, p, "/")
              pkg = p[length(p)-1]
              total[pkg] += $2
              if ($3 > 0) covered[pkg] += $2
            } END {
              for (k in total) printf "%s: %.1f%%\n", k, 100*covered[k]/total[k]
            }' coverage.out | sort
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  platform-build:
    name: Platform build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Use checkout for starter module
        run: |
          go work init .
          go work use ./templates/starter

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libxxf86vm-dev libgl1-mesa-dev

      - name: Build Castrum packages
        run: go build ./...

      - name: Test directory persistence
        run: go test ./asset -run '^TestDirectory' -count=1 -timeout=60s

      - name: Test starter module
        working-directory: templates/starter
        run: go test ./...

      - name: Vet starter module
        working-directory: templates/starter
        run: go vet ./...
