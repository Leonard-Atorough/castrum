name: Release

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (auto = derived from conventional commits)"
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      dry_run:
        description: "Compute version + changelog preview only"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Tag
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Enforce semver tag format
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '${GITHUB_REF_NAME}' does not match vX.Y.Z semantic versioning"
            exit 1
          fi
          echo "Releasing ${GITHUB_REF_NAME}"

  test:
    name: Tests (Release Gate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxcursor-dev libxrandr-dev \
            libxinerama-dev libxi-dev libgl1-mesa-dev

      - name: Run tests
        run: go test -race ./...

  compute:
    name: Compute Next Version
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version
        id: next
        run: |
          NEXT="$(bash scripts/bump.sh '${{ inputs.bump }}')"
          echo "Next version: ${NEXT}"
          if git rev-parse "${NEXT}" >/dev/null 2>&1; then
            echo "::error::Tag ${NEXT} already exists"
            exit 1
          fi
          echo "next=${NEXT}" >> "$GITHUB_STEP_SUMMARY"
          echo "next=${NEXT}" >> "$GITHUB_OUTPUT"
        env:
          NEXT: placeholder

      - name: Verify release contains changes
        run: |
          LATEST="$(git tag --list 'v*' --sort=-v:refname | head -n1 || true)"
          if [[ -z "${LATEST}" ]]; then
            # Genesis release: any commit at all is releasable
            COUNT=$(git rev-list --count HEAD)
            BASE="beginning"
          else
            COUNT=$(git rev-list --count "${LATEST}..HEAD")
            BASE="${LATEST}"
          fi
          echo "Commits since ${BASE}: ${COUNT}"
          if (( COUNT == 0 )); then
            echo "Nothing to release — no commits since ${BASE}"
            exit 1
          fi

      - name: Preview changelog (dry run)
        if: inputs.dry_run
        run: |
          git-cliff --unreleased --unreleased-only > /tmp/preview.md || true
          cat /tmp/preview.md >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [test, compute]
    if: ${{ !failure() && inputs.dry_run != true }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Generate release notes
        run: git-cliff --latest --strip all > RELEASE_BODY.md

      - name: Regenerate CHANGELOG.md
        run: git-cliff --output CHANGELOG.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && needs.compute.outputs.version || github.ref_name }}
          body_path: RELEASE_BODY.md
          # files: dist/*     # <- enable when the build matrix ships binaries
