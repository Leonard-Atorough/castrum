name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (auto = derived from conventional commits)"
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      pre:
        description: "Pre-release suffix (e.g. rc, beta). Leave empty for a full release."
        type: string
        default: ""
      dry_run:
        description: "Compute version + changelog preview only (no tag, no release)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    name: Tests (Release Gate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxcursor-dev libxrandr-dev \
            libxinerama-dev libxi-dev libxxf86vm-dev libgl1-mesa-dev xvfb

      - name: Run tests
        run: xvfb-run -a go test -race ./...

      - name: Use checkout for examples and starter
        run: |
          go work init .
          go work use -r ./examples
          go work use ./templates/starter

      - name: Build, vet and test examples and starter
        run: bash ./.github/scripts/check-examples.sh

  platform-build:
    name: Platform build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Use checkout for starter module
        run: |
          go work init .
          go work use ./templates/starter

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxcursor-dev libxrandr-dev \
            libxinerama-dev libxi-dev libxxf86vm-dev libgl1-mesa-dev

      - name: Build Castrum packages
        run: go build ./...

      - name: Test starter module
        working-directory: templates/starter
        run: go test ./...

      - name: Vet starter module
        working-directory: templates/starter
        run: go vet ./...

  release:
    name: Publish Release
    outputs:
      version: ${{ steps.version.outputs.version }}
    needs: [test, platform-build]
    if: ${{ !cancelled() && needs.test.result == 'success' && needs.platform-build.result == 'success' }}
    runs-on: ubuntu-latest
    # Every publish waits for the release environment's approval, so
    # a maintainer decides when a version actually goes out.
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Do not persist the job's GITHUB_TOKEN in git config: its
          # Authorization header would override the app token embedded in
          # the push URL, making GitHub reject the push as github-castrum[bot].
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Mint app installation token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Compute next version
        id: version
        run: |
          if [[ "${{ github.ref_name }}" != "main" ]]; then
            echo "::error::Releases must be dispatched from main (currently on ${{ github.ref_name }})"
            exit 1
          fi

          NEXT="$(bash ./.github/scripts/bump.sh '${{ inputs.bump }}' '${{ inputs.pre }}')"
          echo "Next version: ${NEXT}"

          if git rev-parse "${NEXT}" >/dev/null 2>&1; then
            echo "::error::Tag ${NEXT} already exists"
            exit 1
          fi

          LATEST="$(git tag --list 'v*' --sort=-v:refname | head -n1 || true)"
          if [[ -z "${LATEST}" ]]; then
            COUNT=$(git rev-list --count HEAD)
          else
            COUNT=$(git rev-list --count "${LATEST}..HEAD")
          fi
          if (( COUNT == 0 )); then
            echo "::error::Nothing to release - no commits since ${LATEST:-beginning}"
            exit 1
          fi

          # Pre-1.0 releases are marked as prerelease on GitHub.
          if [[ "${NEXT}" =~ ^v0\. ]]; then
            echo "prerelease=true"  >> "$GITHUB_OUTPUT"
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "make_latest=true"  >> "$GITHUB_OUTPUT"
          fi

          echo "version=${NEXT}" >> "$GITHUB_OUTPUT"
          {
            echo "### Next version: ${NEXT}"
            echo "- Pre-release: $([[ "${NEXT}" =~ ^v0\. ]] && echo yes || echo no)"
            echo "- Commits since ${LATEST:-beginning}: ${COUNT}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Package tutorial assets
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          archive="dist/castrum-tutorial-assets-${VERSION}.zip"
          (cd examples/unreleased/your-first-game && zip -qr "../../../${archive}" audio sprites)
          unzip -t "${archive}"
          unzip -Z1 "${archive}" | grep -q '^audio/'
          unzip -Z1 "${archive}" | grep -q '^sprites/'

      - name: Generate CHANGELOG.md
        run: git-cliff --tag "${{ steps.version.outputs.version }}" --skip-tags 'v0\.0\.' --output CHANGELOG.md

      - name: Pin examples and starter to the release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bash ./.github/scripts/pin-examples.sh "${VERSION}"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxcursor-dev libxrandr-dev \
            libxinerama-dev libxi-dev libxxf86vm-dev libgl1-mesa-dev

      - name: Build pinned examples against the checkout
        run: |
          go work init .
          go work use -r ./examples
          go work use ./templates/starter
          find examples templates/starter -name go.mod -print0 |
          while IFS= read -r -d '' module_file; do
            directory="$(dirname "${module_file}")"
            (cd "${directory}" && go build ./...)
          done

      - name: Preview changelog (dry run)
        if: ${{ inputs.dry_run }}
        run: |
          git-cliff --latest --skip-tags 'v0\.0\.' > /tmp/preview.md
          cat /tmp/preview.md >> "$GITHUB_STEP_SUMMARY"
          git diff -- examples templates/starter
          echo "Dry run complete - no commit, tag or release created."

      - name: Commit release metadata, create and push tag
        if: ${{ !inputs.dry_run }}
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config user.name "github-castrum[bot]"
          git config user.email "41898282+github-castrum[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          find examples templates/starter -name go.mod -print0 | xargs -0 git add --
          git commit -m "chore(release): ${{ steps.version.outputs.version }}" \
            -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
          git tag "${{ steps.version.outputs.version }}"
          git push "https://x-access-token:${APP_TOKEN}@github.com/${{ github.repository }}.git" main --tags

      - name: Generate release notes
        if: ${{ !inputs.dry_run }}
        run: git-cliff --latest --strip all --skip-tags 'v0\.0\.' > RELEASE_BODY.md

      - name: Create GitHub Release
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ steps.app-token.outputs.token }}
          tag_name: ${{ steps.version.outputs.version }}
          body_path: RELEASE_BODY.md
          prerelease: ${{ steps.version.outputs.prerelease }}
          make_latest: ${{ steps.version.outputs.make_latest }}
          files: dist/castrum-tutorial-assets-*.zip

  verify-published:
    name: Verify published examples
    needs: release
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.version }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxcursor-dev libxrandr-dev \
            libxinerama-dev libxi-dev libxxf86vm-dev libgl1-mesa-dev xvfb

      - name: Wait for the published module
        run: |
          for attempt in {1..6}; do
            if go mod download "github.com/Leonard-Atorough/castrum@${VERSION}"; then
              break
            fi
            if (( attempt == 6 )); then
              echo "::error::Published module ${VERSION} is unavailable after six attempts"
              exit 1
            fi
            sleep 20
          done

      - name: Build, vet and test without checkout replacements
        run: bash ./.github/scripts/check-examples.sh "${VERSION}"
