name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (auto = derived from conventional commits)"
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      pre:
        description: "Pre-release suffix (e.g. rc, beta). Leave empty for a full release."
        type: string
        default: ""
      dry_run:
        description: "Compute version + changelog preview only (no tag, no release)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    name: Tests (Release Gate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxcursor-dev libxrandr-dev \
            libxinerama-dev libxi-dev libgl1-mesa-dev

      - name: Run tests
        run: go test -race ./...

  release:
    name: Publish Release
    needs: test
    if: ${{ !cancelled() && needs.test.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Mint app installation token
        id: app-token
        uses: tibdex/github-app-token@v2
        with:
          app_id: ${{ secrets.APP_ID }}
          private_key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Compute next version
        id: version
        run: |
          if [[ "${{ github.ref_name }}" != "main" ]]; then
            echo "::error::Releases must be dispatched from main (currently on ${{ github.ref_name }})"
            exit 1
          fi

          NEXT="$(bash ./.github/scripts/bump.sh '${{ inputs.bump }}' '${{ inputs.pre }}')"
          echo "Next version: ${NEXT}"

          if git rev-parse "${NEXT}" >/dev/null 2>&1; then
            echo "::error::Tag ${NEXT} already exists"
            exit 1
          fi

          LATEST="$(git tag --list 'v*' --sort=-v:refname | head -n1 || true)"
          if [[ -z "${LATEST}" ]]; then
            COUNT=$(git rev-list --count HEAD)
          else
            COUNT=$(git rev-list --count "${LATEST}..HEAD")
          fi
          if (( COUNT == 0 )); then
            echo "::error::Nothing to release — no commits since ${LATEST:-beginning}"
            exit 1
          fi

          # Pre-1.0 releases are marked as prerelease on GitHub.
          if [[ "${NEXT}" =~ ^v0\. ]]; then
            echo "prerelease=true"  >> "$GITHUB_OUTPUT"
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "make_latest=true"  >> "$GITHUB_OUTPUT"
          fi

          echo "version=${NEXT}" >> "$GITHUB_OUTPUT"
          {
            echo "### Next version: ${NEXT}"
            echo "- Pre-release: $([[ "${NEXT}" =~ ^v0\. ]] && echo yes || echo no)"
            echo "- Commits since ${LATEST:-beginning}: ${COUNT}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate CHANGELOG.md
        run: git-cliff --skip-tags 'v0\.(0|1)\.' --output CHANGELOG.md

      - name: Preview changelog (dry run)
        if: ${{ inputs.dry_run }}
        run: |
          git-cliff --latest --skip-tags 'v0\.(0|1)\.' > /tmp/preview.md
          cat /tmp/preview.md >> "$GITHUB_STEP_SUMMARY"
          echo "Dry run complete — no tag or release created."

      - name: Commit CHANGELOG, create and push tag
        if: ${{ !inputs.dry_run }}
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "chore(release): ${{ steps.version.outputs.version }}"
          git tag "${{ steps.version.outputs.version }}"
          git push "https://x-access-token:${APP_TOKEN}@github.com/${{ github.repository }}.git" main --tags

      - name: Generate release notes
        if: ${{ !inputs.dry_run }}
        run: git-cliff --latest --strip all --skip-tags 'v0\.(0|1)\.' > RELEASE_BODY.md

      - name: Create GitHub Release
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ steps.app-token.outputs.token }}
          tag_name: ${{ steps.version.outputs.version }}
          body_path: RELEASE_BODY.md
          prerelease: ${{ steps.version.outputs.prerelease }}
          make_latest: ${{ steps.version.outputs.make_latest }}
          # files: dist/*     # <- enable when the build matrix ships binaries
