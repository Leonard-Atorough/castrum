name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g., v1.2.0). Leave empty to auto-calculate."
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'release' && 
       contains(fromJSON('["Leonard-Atorough"]'), github.event.release.author.login)) ||
      (github.event_name == 'workflow_dispatch' && 
       contains(fromJSON('["Leonard-Atorough"]'), github.actor))
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install git-cliff
        uses: taiki-e/install-action@git-cliff

      - name: Determine version (if workflow_dispatch without explicit version)
        if: github.event_name == 'workflow_dispatch' && !inputs.version
        id: auto_version
        run: echo "version=$(git-cliff --bumped-version)" >> "$GITHUB_OUTPUT"

      - name: Set release tag
        id: release_tag
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            TAG="${{ inputs.version || steps.auto_version.outputs.version }}"
          else
            TAG="${{ github.event.release.tag_name }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create release (if workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          gh release create "${{ steps.release_tag.outputs.tag }}" \
            --generate-notes \
            --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch tags
        run: git fetch --tags --force

      - name: Generate changelog for the release
        id: changelog
        run: |
          git-cliff "${{ steps.release_tag.outputs.tag }}" --with-tag-message > CHANGELOG.md

      - name: Update release with generated changelog
        run: |
          gh release edit "${{ steps.release_tag.outputs.tag }}" \
            --notes-file CHANGELOG.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
