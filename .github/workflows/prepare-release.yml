name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type (patch, minor, major)"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run release preparation
        run: bash scripts/release.sh ${{ inputs.bump }} --prepare

      - name: Create pull request
        run: |
          BRANCH="release/$(cat VERSION)"
          git checkout -b "$BRANCH"
          git add VERSION CHANGELOG.md
          git commit -m "chore(release): $(cat VERSION)"
          git push -u origin "$BRANCH"
          
          # Create PR with gh CLI
          gh pr create \
            --title "chore(release): $(cat VERSION)" \
            --body "## Release $(cat VERSION)
            Automated release preparation. Merge to trigger publish workflow.
            **Changes:**
            - VERSION file bumped
            - CHANGELOG.md updated
            
            **Type:** ${{ inputs.bump }}" \
            --base main \
            --head "$BRANCH"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          VERSION=$(cat VERSION)
          echo "✓ Release PR created: $VERSION"
          echo "  Branch: release/$VERSION"
          echo "  Review and merge to proceed with publishing"
