name: Feature Request
description: Suggest a new feature for the Castrum engine.
title: "[FEATURE] "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: "## Feature Proposal"
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve?
      placeholder: "Currently developers cannot... because..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How should this feature work?
      placeholder: |
        Add a new API like:
        ```go
        castrum.DoSomething()
        ```
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Other approaches or workarounds, if any
  - type: dropdown
    id: design
    attributes:
      label: Design status
      description: "The engine designs before coding: features land from settled designs. Where is this one?"
      options:
        - Already designed (link or describe the settled design)
        - Needs a design pass first
        - Small enough to skip a formal design
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Domain
      options:
        - ECS
        - Rendering
        - Input
        - Assets
        - Animation
        - Build/Tooling
        - Documentation
        - Performance
        - Other
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Examples, use cases, links
