name: Bug Report
description: Report a bug in the Castrum engine.
title: "[BUG] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: "## Bug Description"
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clear description of the bug
      placeholder: "The engine crashes when..."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How to reproduce the issue
      placeholder: |
        1. Create a scene with X component
        2. Run the engine with Y config
        3. Observe crash/unexpected behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen instead
    validations:
      required: true
  - type: dropdown
    id: domain
    attributes:
      label: Which domain is affected?
      options:
        - ECS (entities, components, systems, queries, world)
        - Input (bindings, actions, device polling)
        - Rendering (sprites, shapes, cameras, projection)
        - Assets (textures, atlases, loading)
        - Animation
        - Build/Configuration
        - Other (describe in the report)
    validations:
      required: true
  - type: dropdown
    id: reprocontext
    attributes:
      label: Where does it reproduce?
      description: The engine is headless-first: table tests prove backend-free logic, and some behavior is only observable against a real window.
      options:
        - Headless (go test / plain construction)
        - Only against a real window (example or game)
        - Both
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment (Go version, OS)
      placeholder: "Go 1.27, Windows 11"
  - type: input
    id: devices
    attributes:
      label: Input devices and software in play, if input-related
      description: Controller model/mode, Steam Input or other remapping software, mouse
      placeholder: "Xbox Series X controller (XInput), Steam running, no remapping"
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Error Output
      render: go
